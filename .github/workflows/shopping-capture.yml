# Shopping capture: scrapes the official HTTP Shopping API (blessed key) and ingests the
# result into our D1 database, which powers the site's price search and price history.
#
# REQUIRES these repository secrets:
#   BOUNDLESS_API_KEY  the blessed Live key (shopping scope), issued by the Boundless devs
#   INGEST_TOKEN       same value as the Worker secret
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID  (optional) failure alerts
#
# Every run does two bounded passes:
#   1. HOT      re-checks only the (world,item,type) triples that already hold listings, so
#               live prices stay fresh without re-walking the whole catalogue.
#   2. FULL, every six hours: every item on every trading world, both sides. Makes the
#               coverage complete, and it retires DISCOVER, which existed only because a
#               complete pass used to be unaffordable. Discovery remains dispatchable.
#
# Why discovery was not enough: 'hot' only re-reads triples that ALREADY hold a listing, and
# discovery treated an item as "found" once it appeared anywhere, on either side of any one
# world. Together they left most (world, item, side) combinations permanently unvisited, which
# is why ordinary goods showed two shop stands when the game had twenty-five.
#
# ENGINE CONTRACT (from the official docs, reference/boundless.docs/modding/http-shopping.rst):
# the only rate rule is ONE request in flight per key per game server, and the docs say
# explicitly that no client-side delaying or retrying is needed: the server regulates by
# holding responses. The bot therefore runs one strictly serial lane per world, eight lanes at
# a time, with no pacing. Measured sustained: ~0.87 verified units/lane/sec, so a full pass
# over 48 trading worlds (48 x 1136 x 2 = ~109,000 units) is a shade over four hours; the hot
# pass is minutes. Every pass stops at its time budget and simply continues next run: the
# ingest only deletes listings for keys it actually verified, so an interrupted sweep is safe.
#
# GitHub minutes are unmetered on a public repo. The only real ceiling is the six-hour cap on
# a single job, which is why the nightly pass is budgeted at 330 minutes under a 350-minute
# timeout rather than being given "as long as it takes".

name: shopping-capture

on:
  schedule:
    # HOT every two hours: re-reads only the triples that already hold listings, so prices
    # stay fresh. Minutes of work.
    - cron: '23 */2 * * *'
    # FULL every six hours: every item on every trading world, both sides. A pass takes
    # about four hours, so this is as close to continuous as a cron can get while leaving
    # room for the pass to finish and for the hot pass to slip in between.
    #
    # For scale: BUTT cycles its catalogue in 6.6 hours against this same API. Four hours is
    # already faster, and four passes a day means any listing is at most six hours old with
    # the popular ones far fresher, because a busy item sits on twenty-odd worlds that are
    # each visited at a different point in the cycle.
    - cron: '7 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which pass to run'
        type: choice
        options: [both, hot, discover, full]
        default: both
      shard:
        description: 'Discovery shard override (blank = derived from the clock)'
        default: ''

concurrency:
  # Never let two sweeps overlap: they would double the load we put on the game servers
  # and race on the same D1 rows.
  group: boundless-shopping
  cancel-in-progress: false

env:
  BOUNDLESS_API_KEY: ${{ secrets.BOUNDLESS_API_KEY }}
  INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
  # One serial lane per world satisfies the documented one-in-flight rule by construction;
  # the lanes are the throughput. No SHOP_PACE_MS here on purpose: the docs say client-side
  # delays are not needed, and the code default (0) is the documented mode. The env knob still
  # exists as an emergency brake should upstream behaviour ever change.
  SHOP_WORLD_CONCURRENCY: '8'

jobs:
  capture:
    runs-on: ubuntu-latest
    # GitHub caps a single job at six hours; minutes themselves are unmetered on a public
    # repo. A complete pass is ~109,000 units at the measured ~7.5 units/sec, so about four
    # hours: 350 minutes leaves real headroom under the cap without pretending the cap is not
    # there.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bot dependencies
        working-directory: bot
        # Retry transient registry errors (ECONNRESET etc.) so a network blip does not fail
        # the sweep; only a persistent failure surfaces.
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-maxtimeout=120000 && break
            if [ "$i" -eq 3 ]; then echo "npm install failed after 3 attempts"; exit 1; fi
            echo "npm install attempt $i failed (transient network); retrying in 15s..."
            sleep 15
          done

      # --- 1. HOT: keep known listings fresh (cheap) ---
      - name: Hot sweep (refresh known listings)
        if: ${{ github.event.schedule != '7 0,6,12,18 * * *' && (github.event.inputs.mode == '' || github.event.inputs.mode == 'both' || github.event.inputs.mode == 'hot') }}
        working-directory: bot
        env:
          # 30 min. Hot only re-checks (world,item,type) triples that already hold listings:
          # a few thousand units, minutes at the measured ~7 units/sec on 8 lanes. The budget
          # is headroom, not the expected duration; worlds rotate between runs so a truncated
          # tail is picked up next time.
          SHOP_TIME_BUDGET_MS: '1800000'
        run: npm run shopping -- --mode=hot

      # --- 2. DISCOVER: hunt the busiest items not yet found anywhere ---
      - name: Discovery sweep (busiest unfound items)
        if: ${{ github.event.inputs.mode == 'discover' || github.event.inputs.mode == 'both' }}
        working-directory: bot
        env:
          # 30 min. Discovery hunts the busiest never-found items; as the catalogue fills,
          # each run has less to do and finishes early on its own.
          SHOP_TIME_BUDGET_MS: '1800000'
          SHOP_SHARD: ${{ github.event.inputs.shard }}
        run: npm run shopping -- --mode=discover

      # --- 3. FULL: nightly, and on demand. Every item on every trading world, both sides ---
      - name: Full sweep
        if: ${{ github.event.schedule == '7 0,6,12,18 * * *' || github.event.inputs.mode == 'full' }}
        working-directory: bot
        env:
          # 330 min. A complete pass over 48 trading worlds is 48 x 1136 x 2 = ~109,000 units
          # at the measured ~7.5 units/sec, so a shade over four hours. The budget has to
          # EXCEED that or the pass is truncated every single night and the tail worlds are
          # never reached; 330 gives an hour of slack and still sits under the job timeout.
          SHOP_TIME_BUDGET_MS: '19800000'
        run: npm run shopping -- --mode=full

      # --- Snapshot today's weighted-average price bands (idempotent upsert) ---
      - name: Roll up price history
        if: ${{ always() && job.status != 'cancelled' }}
        run: |
          curl -sS -X POST "https://boundlessinfo-api.niccolo-sabato.workers.dev/api/ingest/shopping/rollup" \
            -H "authorization: Bearer $INGEST_TOKEN" \
            -H "content-type: application/json" \
            -d '{}' | head -c 300
          echo

      # --- Notify Telegram if anything above failed (best-effort, no-op if unset) ---
      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" \
              --data-urlencode "text=Boundless shopping capture FAILED: ${{ github.workflow }} (run #${{ github.run_number }}) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
