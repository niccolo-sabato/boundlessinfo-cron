# Planet map capture: turns worlds into stored images at 1 pixel per block, which is what
# lets the site show WHERE a shop actually is instead of only that it exists.
#
# REQUIRES these repository secrets:
#   BOUNDLESS_API_KEY_LOD0  the blessed Live key with the lod0maps scope (a DIFFERENT key
#                           from the shopping one), issued by the Boundless devs
#   INGEST_TOKEN            same value as the Worker secret
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID  (optional) failure alerts
#
# Why this is its own workflow rather than a step inside shopping-capture: one LOD0 response
# takes 9 to 13 minutes by design (the world server paces itself so the request cannot disturb
# play), so a map run is long and sparse while a shopping run is short and dense. Separating
# them means a slow capture can never eat the budget that keeps prices fresh.
#
# The free 2020 mirror at maps.playboundless.com is deliberately NOT used. It was measured:
# today's terrain does not match it under any transform, and no frozen image matches our
# capture under any name, because the permanent worlds were regenerated after 2020. A map of
# a planet that no longer exists would put every shop marker on meaningless ground.
#
# Two modes. 'new' only maps worlds we hold nothing for. 'refresh' does that FIRST and then
# re-captures stale maps, so it is a superset and is what the twice-daily pass runs: with
# 'new' alone the job silently becomes a no-op the moment the backlog drains, and every map
# ages forever. Unmapped worlds always outrank stale ones, so a new sovereign or a fresh nexus
# is still picked up ahead of any refresh. Measured 2026-07-31, and the reason the 'new' pass
# dropped from hourly to six-hourly: the backlog is drained (145 of 146 worlds mapped), so 9
# of the last 10 'new' runs did nothing at all.
#
# Every world is re-captured after MAP_REFRESH_DAYS (7). Measured over 145 real captures the
# median takes 5.5 minutes, so a complete pass over the universe is 18.2 hours of capture time
# against the ~70 hours a week this schedule provides: a weekly refresh of everything costs
# about a quarter of the budget, which is why it is not rationed by activity.
#
# STORAGE IS CAPPED IN CODE. The ingest endpoint refuses an upload that would push us past a
# self-imposed ceiling (200 worlds / 3 GiB, against an R2 free tier of 10 GB) and the run
# stops with a non-zero exit so this workflow alerts. The billing alert on the account only
# warns after the fact; this is the part that actually prevents a bill.

name: map-capture

on:
  schedule:
    # Twice a day, off the hour. At roughly twelve minutes a world, a five-hour run covers
    # about twenty worlds, so the whole universe is mapped within a few days and refreshes
    # comfortably inside a month afterwards.
    # The long pass, twice a day: drains any backlog, then refreshes what has gone stale.
    - cron: '41 3,15 * * *'
    # SIX-HOURLY sweep for worlds we hold no map for. This was hourly, and hourly has stopped
    # earning its place: the backlog it was written to drain IS drained (145 of 146 live
    # worlds are mapped), so 9 of the last 10 runs reported worlds_done 0, bytes_written 0 and
    # exited in 12 to 25 seconds. It is a green scheduled job that does nothing, which is the
    # exact failure mode this pipeline is meant to be watched for.
    #
    # It cost little in itself, but it declared 24 scheduled runs a day in a repo that was
    # declaring ~190 and getting ~50 delivered, and those drops were falling on jobs that had
    # real work to do. At 4 a day, and interleaved with the twice-daily refresh (which does
    # unmapped worlds FIRST, so it is a superset of this mode), no new world waits more than
    # about six hours for its first map. Exos live for days, so that is well inside the window.
    - cron: '11 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'new = only unmapped worlds, refresh = also re-capture stale maps'
        type: choice
        options: [new, refresh]
        default: new
      worlds:
        description: 'Comma-separated world ids (blank = the planner decides)'
        default: ''
      max:
        description: 'Maximum worlds this run may capture'
        default: ''
      force:
        description: 'Re-capture the named worlds whatever their age (needs "worlds")'
        type: boolean
        default: false
      dry_run:
        description: 'Print the plan and stop'
        type: boolean
        default: false

concurrency:
  # Two map runs at once would queue behind each other on the same world servers and race on
  # the same R2 objects.
  group: boundless-maps
  cancel-in-progress: false

env:
  BOUNDLESS_API_KEY_LOD0: ${{ secrets.BOUNDLESS_API_KEY_LOD0 }}
  INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}

jobs:
  capture:
    runs-on: ubuntu-latest
    # The hosted-runner ceiling is 6 hours; the capture stops itself at 5 so the summary and
    # the audit row are always written.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bot dependencies
        working-directory: bot
        # Retry transient registry errors (ECONNRESET etc.) so a network blip does not fail
        # the run; only a persistent failure surfaces.
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-maxtimeout=120000 && break
            if [ "$i" -eq 3 ]; then echo "npm install failed after 3 attempts"; exit 1; fi
            echo "npm install attempt $i failed (transient network); retrying in 15s..."
            sleep 15
          done

      - name: Capture maps
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: bot
        env:
          # The short new-only sweeps get a small budget (about four worlds); the twice-daily
          # pass gets five hours. A manual dispatch uses whatever it asks for.
          # BOTH of these match on the cron STRING, so the literal has to be kept in step with
          # the `schedule:` block above, in both places. A mismatch here does not fail: it
          # silently swaps the mode and the budget, which is the same class of bug that left
          # the full shopping sweep never running for a week.
          MAP_TIME_BUDGET_MS: ${{ github.event.schedule == '11 */6 * * *' && '3000000' || '18000000' }}
        # `force` exists because the scheduled sweep's seven-day staleness rule is right for
        # the sweep and wrong for a person: asking for one world by name is already the
        # statement that it should be re-read. The bot refuses to force without a world list,
        # so this cannot turn into a re-capture of all 145 worlds by accident.
        run: npm run maps -- --mode=${{ github.event.inputs.mode || (github.event.schedule == '11 */6 * * *' && 'new' || 'refresh') }} ${{ github.event.inputs.worlds && format('--worlds={0}', github.event.inputs.worlds) || '' }} ${{ github.event.inputs.max && format('--max={0}', github.event.inputs.max) || '' }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # --- Plan only (workflow_dispatch): show what a run WOULD do, capture nothing. ---
      - name: Show the plan
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: bot
        run: npm run maps -- --dry-run --mode=${{ github.event.inputs.mode || 'refresh' }}

      # --- Notify Telegram if anything above failed (best-effort, no-op if unset) ---
      # This also fires when the storage cap stops a run, which is exactly when the owner
      # needs to know: it means maps must be pruned or the ceiling reconsidered.
      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" \
              --data-urlencode "text=Boundless map capture FAILED (or hit the storage cap): ${{ github.workflow }} (run #${{ github.run_number }}) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
